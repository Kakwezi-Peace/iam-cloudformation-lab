AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Lab - Creates IAM Users, Groups, and Permissions

Resources:

  IAMUserPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: iam-lab-temp-password
      Description: Temporary password for all IAM lab users
      GenerateSecretString:
        SecretStringTemplate: '{"username": "lab-users"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludeCharacters: '"@/\\'
        RequireEachIncludedType: true

  S3UserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: S3UserGroup
      Policies:
        - PolicyName: S3ListBucketsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: '*'

  EC2UserGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2UserGroup
      Policies:
        - PolicyName: EC2ListAndCreatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeImages
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:RunInstances
                Resource: '*'

  EC2RestrictedGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2RestrictedGroup
      Policies:
        - PolicyName: DenyEC2CreatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action:
                  - ec2:RunInstances
                Resource: '*'

  EC2User1:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user1
      Groups:
        - !Ref EC2UserGroup
      LoginProfile:
        Password: TempPass123!
        PasswordResetRequired: true

  EC2User2:
    Type: AWS::IAM::User
    Properties:
      UserName: ec2-user2
      Groups:
        - !Ref EC2UserGroup
        - !Ref EC2RestrictedGroup
      LoginProfile:
        Password: TempPass123!
        PasswordResetRequired: true

  S3User:
    Type: AWS::IAM::User
    Properties:
      UserName: s3-user
      Groups:
        - !Ref S3UserGroup
      LoginProfile:
        Password: TempPass123!
        PasswordResetRequired: true

Outputs:
  PasswordSecretName:
    Description: Secret holding the temp password
    Value: !Ref IAMUserPassword
  EC2User1Name:
    Description: EC2 User 1
    Value: !Ref EC2User1
  EC2User2Name:
    Description: EC2 User 2
    Value: !Ref EC2User2
  S3UserName:
    Description: S3 User
    Value: !Ref S3User
